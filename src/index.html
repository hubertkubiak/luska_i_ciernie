<!doctype html>
<html lang="pl" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <title>Łuska i Ciernie</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Odkrywaj romantasy po tropach, pikanterii i statusie serii." />
    <!-- Favicon: SVG dla nowoczesnych przeglądarek, ICO (16/32/48 px) jako zapas, PNG dla iOS. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0910" />

    <!-- Fonty są serwowane z naszej domeny (pakiety @fontsource w angular.json → "styles"), a nie
         z Google Fonts: wczytanie ich z serwerów Google przekazuje Google adres IP czytelniczki
         bez jej zgody (RODO). Patrz docs/PRAWNE.md. -->
    <!-- Bez preconnect do covers.openlibrary.org: otwierałby połączenie (i przekazywał IP) przy każdej
         wizycie, także gdy okładki są wyłączone (COVER_SOURCE=none). Okładkę LCP i tak zapowiada
         <link rel="preload">, który NgOptimizedImage dopisuje w SSR — patrz app.config.ts. -->
  </head>
  <body>
    <!-- Runy tropów (SPEC §2.5): sprite SVG wklejony w szablon dokumentu. Trafia do każdego
         HTML-a z serwera i prerenderu, a komponent <app-rune> tylko wskazuje symbol przez <use>.
         Id symbolu = "rune-" + slug tropu. Kolor i grubość linii dziedziczą się z miejsca użycia. -->
