<header class="header">
  <!-- Not just href="#tresc": against <base href="/"> that is "/#tresc", i.e. the home page. -->
  <a class="skip" [attr.href]="skipHref()" i18n="@@header.skip">Przejdź do treści</a>

  <a class="logo" routerLink="/" i18n-aria-label="@@header.logoLabel" aria-label="Łuska i Ciernie — strona główna">Łuska i Ciernie</a>

  <!-- On narrow screens the menu hides in a popover. popovertarget = the browser itself
       opens and closes the panel (Esc, click outside) — works before hydration and without JavaScript. -->
  <button class="toggle" type="button" popovertarget="mapa-krain" i18n-aria-label="@@header.openMenu" aria-label="Otwórz menu">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <!-- three dragon claws -->
      <path d="M6 3c3 5 3 12 0 18M12 3c3 5 3 12 0 18M18 3c3 5 3 12 0 18" />
    </svg>
    <span class="toggle-label" i18n="@@header.menu">Mapa</span>
  </button>

  <div id="mapa-krain" class="menu" popover #menu>
    <button class="close" type="button" popovertarget="mapa-krain" popovertargetaction="hide">
      <app-rune trope="enemies-to-lovers" />
      <span i18n="@@header.closeMenu">Zwiń mapę</span>
    </button>

    <nav i18n-aria-label="@@header.navLabel" aria-label="Główna nawigacja">
      <ul>
        @for (item of nav(); track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active">
              {{ item.label }}
              <small>{{ item.meaning }}</small>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Language and theme: two small round buttons kept together, so they take one slot in the bar. -->
    <div class="prefs">
      <app-language-switch />
      <app-theme-toggle />
    </div>
    <app-account />
  </div>
</header>
