<section class="tropes">
  <p class="label" i18n="@@tropes.kicker">Księga run</p>
  <h1 i18n="@@tropes.title">Tropy</h1>
  <p class="lead" i18n="@@tropes.lead">
    Każdy trop to ścieżka, którą prowadzi opowieść. Wybierz runę, a kronikarka pokaże księgi, które nią
    podążają.
  </p>

  @for (group of groups(); track group.id) {
    <section class="realm" [attr.data-realm]="group.id">
      <h2>{{ group.name }}</h2>
      <ul>
        @for (t of group.tropes; track t.slug) {
          <li><app-trope-tile [trope]="t" /></li>
        }
      </ul>
    </section>
  } @empty {
    <p class="state" role="status" i18n="@@state.loading">Smok przeszukuje skarbiec…</p>
  }
</section>
