<app-header />
<main id="tresc">
  <router-outlet />
</main>
<!--
  hydrate never: the footer is plain text, with no events and no changing data. The server renders it,
  and the browser leaves that HTML alone — it never downloads the component's code nor hydrates it.
  Pages rendered only in the browser (RenderMode.Client) have no server HTML,
  so the default @defer trigger applies there: on idle.
-->
@defer (hydrate never) {
  <app-footer />
}
