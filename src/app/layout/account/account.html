@if (user(); as u) {
  <!-- Signing out is a POST, not a link: a GET /wyloguj could be triggered even by an image
       <img src="…/wyloguj"> on a foreign site. The form also works without JavaScript. -->
  <form class="account" method="post" action="auth/wyloguj">
    <a class="login" routerLink="/moja-polka" routerLinkActive="active">
      <svg class="door" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <!-- an open door: you are on the other side of the threshold -->
        <path class="frame" d="M5 21V10a7 7 0 0 1 14 0v11M3 21h18" />
        <path class="leaf open" d="M9 21V11.5a3 3 0 0 1 3-3l3 1v11.5" />
      </svg>
      <span class="login-text">
        <span class="name" [attr.title]="u.displayName">{{ u.displayName }}</span>
        <small i18n="@@header.yourShelf">Twój skarbiec</small>
      </span>
    </a>
    <button class="logout" type="submit">
      <span i18n="@@header.logout">Opuść dwór</span>
      <small i18n="@@header.logoutMeaning">Wyloguj</small>
    </button>
  </form>
} @else {
  <!-- "Threshold" literally: an arched door, ajar, with light in the gap. -->
  <a class="login" routerLinkActive="active" routerLink="/logowanie" [queryParams]="loginParams()">
    <svg class="door" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path class="frame" d="M5 21V10a7 7 0 0 1 14 0v11M3 21h18" />
      <path class="leaf" d="M9 21V11.5a3 3 0 0 1 3-3l3 1v11.5" />
      <circle class="knob" cx="13.6" cy="15.5" r="0.7" />
    </svg>
    <span class="login-text">
      <span i18n="@@header.login">Przekrocz próg</span>
      <small i18n="@@header.loginMeaning">Zaloguj się</small>
    </span>
  </a>
}
