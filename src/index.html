<!doctype html>
<html lang="pl" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <title>Łuska i Ciernie</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Odkrywaj romantasy po tropach, pikanterii i statusie serii." />
    <!-- Favicon: SVG for modern browsers, ICO (16/32/48 px) as a fallback, PNG for iOS. -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0910" />

    <!-- Fonts are served from our own domain (@fontsource packages in angular.json → "styles"), not
         from Google Fonts: loading them from Google's servers hands Google the reader's IP address
         without her consent (GDPR). See docs/PRAWNE.md. -->
    <!-- No preconnect to covers.openlibrary.org: it would open a connection (and pass the IP) on every
         visit, even when covers are switched off (COVER_SOURCE=none). The LCP cover is announced anyway
         by the <link rel="preload"> that NgOptimizedImage adds during SSR — see app.config.ts. -->
  </head>
  <body>
    <!-- Trope runes (SPEC §2.5): an SVG sprite pasted into the document template. It is in every
         HTML from the server and the prerender, and the <app-rune> component only points at a symbol via <use>.
         Symbol id = "rune-" + trope slug. Colour and stroke width are inherited from where it is used. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="rune-enemies-to-lovers" viewBox="0 0 24 24">
        <path d="M5 5l14 14M19 5L5 19M3 11l4-4M17 7l4 4M8 20l-4-4M20 16l-4 4" />
      </symbol>
      <symbol id="rune-fated-mates" viewBox="0 0 24 24">

      </symbol>

        <path d="M4 19h16M5 19L3 8l5 4 4-8 4 8 5-4-2 11M12 4v3" />
      </symbol>
      <symbol id="rune-pakty-i-targi" viewBox="0 0 24 24">

        <path d="M12 8l1.5 4-1.5 4-1.5-4zM17 17l3 4M7 17l-3 4" />

      <symbol id="rune-wojenne-akademie" viewBox="0 0 24 24">

      <symbol id="rune-slow-burn" viewBox="0 0 24 24">
        <path d="M10 11h4v10h-4zM12 11V8M12 3c1.6 2 1.6 3.4 0 5-1.6-1.6-1.6-3 0-5z" />

      <symbol id="rune-found-family" viewBox="0 0 24 24">
        <circle cx="12" cy="6" r="2.5" />
        <circle cx="6" cy="17" r="2.5" />
        <circle cx="18" cy="17" r="2.5" />

    <app-root></app-root>
