<section class="hero">
  <app-sparks />
  <h1>Łuska i Ciernie</h1>
  <p class="tagline">
    Archiwum romantasy czytane po tropach — od więzi przeznaczenia po jeźdźców smoków.
  </p>
  <a class="cta" routerLink="/szukaj">Przeszukaj archiwum</a>
</section>

<app-trope-of-the-day />

<section class="start">
  <h2>Na dobry początek</h2>
  <ul>
    @for (b of starters; track b.slug) {
      <li><a [routerLink]="['/ksiazka', b.slug]">{{ b.title }}</a></li>
    }
  </ul>
</section>
