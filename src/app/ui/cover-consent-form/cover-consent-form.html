<!-- action is RELATIVE: against <base href> it gives /okladki or /en/okladki. -->
<!-- With COVER_SOURCE=none there is nothing to consent to — no form at all. -->
@if (available) {
  <form method="post" action="okladki">
    <input type="hidden" name="next" [attr.value]="next()" />
    @if (granted()) {
      <button type="submit" name="zgoda" value="nie" i18n="@@covers.withdraw">Cofnij zgodę na prawdziwe okładki</button>
    } @else {
      <button type="submit" name="zgoda" value="tak" i18n="@@covers.show">Pokaż prawdziwe okładki</button>
      <small i18n="@@covers.note">Ładowane z Open Library (USA): Twoja przeglądarka przekaże tam swój adres IP.</small>
    }
  </form>
}
