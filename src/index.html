<!doctype html>
<html lang="pl" data-theme="night">
  <head>
    <meta charset="utf-8" />
    <title>Łuska i Ciernie</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Odkrywaj romantasy po tropach, pikanterii i statusie serii." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonty: preconnect skraca handshake; display=swap = tekst widoczny od razu fontem zastępczym.
         Google Fonts dzieli pliki po unicode-range, więc podzbiór latin-ext (ą, ę, ł…) pobierze się sam. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Okładki z Open Library — NgOptimizedImage ostrzega, gdy obraz `priority` nie ma preconnect. -->
    <link rel="preconnect" href="https://covers.openlibrary.org" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
