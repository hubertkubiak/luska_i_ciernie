@let b = book();
<a class="card" [routerLink]="['/ksiazka', b.slug]">
  <!-- no priority: covers on lists load lazily (loading="lazy") -->
  <app-cover [book]="b" [width]="120" [height]="180" />
  <span class="title">{{ b.title }}</span>
  <span class="label">
    {{ b.year }}
    @if (b.series) {
      · {{ b.series.name }} #{{ b.series.index }}
    }
  </span>
  <app-spice-meter [spice]="b.spice" />
</a>
